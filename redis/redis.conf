# Redis for this project is a cache, not a database: everything in it can be rebuilt
# from Postgres, so it's tuned to stay small and never write to disk.

# Cap memory so the cache can't grow without bound...
maxmemory 64mb
# ...and when it's full, evict the least recently used keys instead of rejecting writes.
maxmemory-policy allkeys-lru

# No persistence: no RDB snapshots, no append-only file. A restart starts with an
# empty cache, which just means the next feed request is a MISS.
save ""
appendonly no
